---
name: sdr
board: boards/red-pitaya
version: 0.1.2

cores:
  - fpga/cores/redp_adc_v1_0
  - fpga/cores/redp_dac_v1_0
  - fpga/cores/axi_ctl_register_v1_0
  - fpga/cores/axi_sts_register_v1_0
  - fpga/cores/dna_reader_v1_0
  - fpga/cores/comparator_v1_0
  - fpga/cores/latch_v1_0
  - fpga/cores/one_clock_pulse_v1_0
  - fpga/cores/register_v1_0
  - fpga/cores/delay_v1_0
  - fpga/cores/agc_mux_v1_0

memory:
  - name: control
    offset: '0x60000000'
    range: 4K
  - name: status
    offset: '0x50000000'
    range: 4K
  - name: adc_fifo
    offset: '0x43C10000'
    range: 64K

control_registers:
  - led
  - receive_frequency
  - volume

status_registers:
  - signal_strength

parameters:
  fclk0: 166666667
  bram_addr_width: 13
  adc_width: 14
  n_adc: 2

xdc:
  - boards/red-pitaya/config/ports.xdc
  - boards/red-pitaya/config/clocks.xdc

drivers:
  - ./sdr.hpp
  - server/drivers/common.hpp

